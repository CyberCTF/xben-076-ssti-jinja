# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-076-24 SSTI Jinja (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a small Flask page that greets the visitor by name.
# The benchmark folder benchmarks/XBEN-076-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-076-ssti-jinja

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.119.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the SSTI Jinja page answers
    http: http://web:5000/
    wait: 180
  - name: the greeting renders the given name
    script: checks/probe.sh
    wait: 60

message: |
  SSTI Jinja answers at http://localhost:{{ machines.web.services.0.publish }}/.
  A greeting page. The flag is hidden on the server, look in /tmp.
